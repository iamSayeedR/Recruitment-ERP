version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: erp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-recruitment_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-recruitment_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: erp-keycloak
    restart: unless-stopped
    command: start-dev --http-enabled=true --http-port=8080 --http-host=0.0.0.0 --hostname-strict=false --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_HTTP_HOST: "0.0.0.0"
      KC_HTTP_PORT: "8080"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme_in_production}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/recruitment_erp
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  kafka:
    image: apache/kafka:3.7.0
    container_name: erp-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5N0m_6v5TViO0o2-r8M70Q}
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: erp-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - erp-network

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: erp-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_in_production}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: erp-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  iam-service:
    build:
      context: ../backend/iam-service
    container_name: erp-iam
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/recruitment_erp
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-changeme_in_production}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/recruitment-erp/protocol/openid-connect/certs
      - KEYCLOAK_ISSUER_URI=http://127.0.0.1:8180/realms/recruitment-erp
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - erp-network

  requisition-service:
    build:
      context: ../backend/requisition-service
    container_name: erp-requisition
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - SERVER_PORT=8080
      - JAVA_TOOL_OPTIONS=-Duser.timezone=UTC
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/recruitment_erp
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-changeme_in_production}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/recruitment-erp/protocol/openid-connect/certs
      - KEYCLOAK_ISSUER_URI=http://127.0.0.1:8180/realms/recruitment-erp
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - erp-network

  candidate-service:
    build:
      context: ../backend/candidate-service
    container_name: erp-candidate
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      - SERVER_PORT=8080
      - JAVA_TOOL_OPTIONS=-Duser.timezone=UTC
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/recruitment_erp
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-changeme_in_production}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/recruitment-erp/protocol/openid-connect/certs
      - KEYCLOAK_ISSUER_URI=http://127.0.0.1:8180/realms/recruitment-erp
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - erp-network

  compliance-service:
    build:
      context: ../backend/compliance-service
    container_name: erp-compliance
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      - SERVER_PORT=8080
      - JAVA_TOOL_OPTIONS=-Duser.timezone=UTC
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/recruitment_erp
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-changeme_in_production}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/recruitment-erp/protocol/openid-connect/certs
      - KEYCLOAK_ISSUER_URI=http://127.0.0.1:8180/realms/recruitment-erp
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - erp-network

  gateway-service:
    build:
      context: ../backend/gateway-service
    container_name: erp-gateway
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/recruitment-erp/protocol/openid-connect/certs
      - KEYCLOAK_ISSUER_URI=http://127.0.0.1:8180/realms/recruitment-erp
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - erp-network

networks:
  erp-network:
    name: erp-network
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  minio_data:
