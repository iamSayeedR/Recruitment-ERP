# Test profile — disables infra dependencies not available in CI/unit tests
spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://example.com/issuer  # Placeholder; WebMvcTest won't validate
